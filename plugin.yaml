name: routed-model
version: 0.1.0
description: "Expose which model the active route (e.g. openrouter/auto) actually served, for the Desktop status bar."
author: Jacob Hodge
kind: standalone
provides_hooks:
  - post_api_request
platforms:
  - linux
  - windows
dependencies:
  hermes-agent: ">=0.20.0"
sdk_compatibility:
  desktop_plugin_sdk: "^0.1.0"
  notes: "Uses @hermes/plugin-sdk imports (host, useValue, ctx.rest, ctx.os.writeClipboard) and FastAPI APIRouter backend."
